name: Release

# Push a tag like v1.1.0 to build asci.exe and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build asci.exe
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name asci asci.py
          dist\asci.exe cat
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp asci.py dist/asci.py
          gh release create "$GITHUB_REF_NAME" dist/asci.exe dist/asci.py \
            --title "asci $GITHUB_REF_NAME" --generate-notes
